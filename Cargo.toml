[package]
name = "super8-fixer"
version = "1.0.0"
edition = "2024"
description = "Repairs frame-line slips (framing errors) in digitized Super 8 / 8 mm film and stabilizes the picture"
license-file = "LICENSE.md"
publish = false

[[bin]]
name = "Super8Fixer"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = "0.37"
rfd = "0.17"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"

[profile.dev]
opt-level = 2
